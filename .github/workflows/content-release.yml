name: Content Release

on:
  push:
    branches: [master]
    paths:
      - 'data-preprocess/easy-vibe.json'
      - 'data-preprocess/vibe-vibe.json'
      - 'data-preprocess/sync_assets.py'
      - 'ai-coding-guide'
      - 'easy-vibe'
      - 'vibe-vibe'
      - 'CodexGuide'
      - '.github/workflows/content-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync content assets
        run: python data-preprocess/sync_assets.py

      - name: Package content bundle
        run: |
          cd ebook/app/src/main/assets
          zip -r $GITHUB_WORKSPACE/content-bundle.zip . -x ".gitkeep" ".gitignore"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: content-${{ github.run_number }}
          name: "📖 内容更新 #${{ github.run_number }}"
          body: |
            ## 变更详情
            ${{ github.event.head_commit.message || '手动触发更新' }}

            ## 内容版本
            更新内容详见 `version.json`
          files: content-bundle.zip
          generate_release_notes: false
